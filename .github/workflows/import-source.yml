name: Import application source

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-source.yml

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'badrsekrafi/subManager' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Extract the reviewed application snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path.cwd().resolve()
          with ZipFile('project-source.zip') as bundle:
              for entry in bundle.infolist():
                  if not (root / entry.filename).resolve().is_relative_to(root):
                      raise ValueError('Invalid archive path')
              bundle.extractall(root)
          Path('project-source.zip').unlink()
          PY
      - name: Commit the application files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Import subscription manager source and Render configuration'
          git push
