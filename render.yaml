# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: gestion-abonnements
    runtime: node
    plan: free
    buildCommand: npm --prefix client ci --include=dev && npm --prefix server ci --omit=dev && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
